[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-uplift-lab"
version = "0.1.0"
description = "Reproducible email targeting evaluation on a randomised experiment"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "pandas==3.1.1", "scipy==1.17.1", "scikit-learn==1.9.1", "matplotlib==3.11.2", "joblib==1.6.0", "threadpoolctl==3.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
